<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mainframe® — Creative Agency</title>
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      :root {
        --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
        --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
      }
      body {
        font-family: var(--font-body);
        background-color: black;
        color: white;
        overflow-x: hidden;
      }
      .font-heading {
        font-family: var(--font-heading);
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .animate-blink {
        animation: blink 1s step-end infinite;
      }
    </style>
</head>
<body class="bg-black text-white selection:bg-white selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // Custom typewriter hook
      function useTypewriter(text, speed = 38, startDelay = 600) {
        const [displayed, setDisplayed] = useState('');
        const [done, setDone] = useState(false);

        useEffect(() => {
          let timeoutId = setTimeout(() => {
            let i = 0;
            let intervalId = setInterval(() => {
              if (i < text.length) {
                setDisplayed(text.substring(0, i + 1));
                i++;
              } else {
                setDone(true);
                clearInterval(intervalId);
              }
            }, speed);
            return () => clearInterval(intervalId);
          }, startDelay);

          return () => clearTimeout(timeoutId);
        }, [text, speed, startDelay]);

        return { displayed, done };
      }

      function App() {
        const videoRef = useRef(null);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [copied, setCopied] = useState(false);
        const [activeModal, setActiveModal] = useState(null);

        const { displayed, done } = useTypewriter(
          "Glad you stopped in. Good taste tends to find us. Now, what are we building?"
        );

        const [pillsVisible, setPillsVisible] = useState(false);
        useEffect(() => {
          const timer = setTimeout(() => setPillsVisible(true), 400);
          return () => clearTimeout(timer);
        }, []);

        // Mouse-scrub video control logic
        const lastXRef = useRef(null);
        const targetTimeRef = useRef(0);
        const isSeekingRef = useRef(false);

        const handleMouseMove = useCallback((e) => {
          const video = videoRef.current;
          if (!video || !video.duration) return;

          const currentX = e.clientX;
          if (lastXRef.current === null) {
            lastXRef.current = currentX;
            return;
          }

          const delta = currentX - lastXRef.current;
          lastXRef.current = currentX;

          const SENSITIVITY = 0.8;
          const duration = video.duration;
          
          let newTime = targetTimeRef.current + (delta / window.innerWidth) * SENSITIVITY * duration;
          if (newTime < 0) newTime = 0;
          if (newTime > duration) newTime = duration;

          targetTimeRef.current = newTime;

          if (!isSeekingRef.current) {
            isSeekingRef.current = true;
            video.currentTime = targetTimeRef.current;
          }
        }, []);

        useEffect(() => {
          window.addEventListener('mousemove', handleMouseMove);
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
          };
        }, [handleMouseMove]);

        const handleVideoSeeked = () => {
          const video = videoRef.current;
          if (!video) return;

          if (Math.abs(video.currentTime - targetTimeRef.current) > 0.05) {
            video.currentTime = targetTimeRef.current;
          } else {
            isSeekingRef.current = false;
          }
        };

        const handleCopyEmail = () => {
          navigator.clipboard.writeText('hello@mainframe.co');
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        };

        const handleActionClick = (actionName) => {
          setActiveModal(actionName);
        };

        return (
          <div className="relative w-full h-screen overflow-hidden bg-black text-white">
            {/* BACKGROUND VIDEO */}
            <video
              ref={videoRef}
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
              className="fixed inset-0 z-0 w-full h-full object-cover object-[70%_center] pointer-events-none"
              muted
              playsInline
              preload="auto"
              onSeeked={handleVideoSeeked}
            />

            {/* SUBTLE DARK OVERLAY */}
            <div className="fixed inset-0 z-0 bg-black/30 pointer-events-none" />

            {/* NAVBAR */}
            <header className="fixed top-0 left-0 w-full z-10 px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center bg-gradient-to-b from-black/60 to-transparent">
              <a href="#" className="flex items-center gap-3 no-underline group">
                <span className="font-heading text-[21px] sm:text-[26px] tracking-tight text-white">
                  Mainframe®
                </span>
                <span className="text-[25px] sm:text-[30px] text-white select-none leading-none -mt-1" style={{ letterSpacing: '-0.02em' }}>
                  ✳︎
                </span>
              </a>

              <nav className="hidden md:flex items-center text-[23px] text-white space-x-2">
                <a href="#labs" onClick={(e) => { e.preventDefault(); handleActionClick('Labs'); }} className="hover:opacity-60 transition-opacity">Labs</a>
                <span className="text-white/60">,</span>&nbsp;
                <a href="#studio" onClick={(e) => { e.preventDefault(); handleActionClick('Studio'); }} className="hover:opacity-60 transition-opacity">Studio</a>
                <span className="text-white/60">,</span>&nbsp;
                <a href="#openings" onClick={(e) => { e.preventDefault(); handleActionClick('Openings'); }} className="hover:opacity-60 transition-opacity">Openings</a>
                <span className="text-white/60">,</span>&nbsp;
                <a href="#shop" onClick={(e) => { e.preventDefault(); handleActionClick('Shop'); }} className="hover:opacity-60 transition-opacity">Shop</a>
              </nav>

              <div className="hidden md:flex items-center">
                <button 
                  onClick={() => handleActionClick('Get in touch')}
                  className="text-[23px] text-white underline underline-offset-2 hover:opacity-60 transition-opacity bg-transparent border-none cursor-pointer p-0"
                >
                  Get in touch
                </button>
              </div>

              <button
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="md:hidden flex flex-col justify-between w-6 h-5 bg-transparent border-none cursor-pointer z-30 p-0 focus:outline-none"
                aria-label="Toggle navigation menu"
              >
                <span className={`w-6 h-[2px] bg-white transition-all duration-300 origin-center ${mobileMenuOpen ? 'rotate-45 translate-y-[9px]' : ''}`} />
                <span className={`w-6 h-[2px] bg-white transition-all duration-300 ${mobileMenuOpen ? 'opacity-0' : ''}`} />
                <span className={`w-6 h-[2px] bg-white transition-all duration-300 origin-center ${mobileMenuOpen ? '-rotate-45 -translate-y-[9px]' : ''}`} />
              </button>
            </header>

            {/* MOBILE OVERLAY */}
            <div className={`fixed inset-0 bg-black/95 backdrop-blur-md z-20 flex flex-col justify-center px-8 gap-8 transition-all duration-300 md:hidden ${mobileMenuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
              <div className="flex flex-col gap-6 text-[32px] font-medium">
                {['Labs', 'Studio', 'Openings', 'Shop'].map((item) => (
                  <button
                    key={item}
                    onClick={() => {
                      setMobileMenuOpen(false);
                      handleActionClick(item);
                    }}
                    className="text-left text-white bg-transparent border-none cursor-pointer hover:opacity-60 transition-opacity p-0"
                  >
                    {item}
                  </button>
                ))}
                <button
                  onClick={() => {
                    setMobileMenuOpen(false);
                    handleActionClick('Get in touch');
                  }}
                  className="text-left text-white underline underline-offset-2 bg-transparent border-none cursor-pointer hover:opacity-60 transition-opacity p-0 mt-4"
                >
                  Get in touch
                </button>
              </div>
            </div>

            {/* HERO SECTION */}
            <main className="relative z-10 h-screen flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 overflow-hidden pointer-events-none">
              <div className="max-w-xl relative z-10 pointer-events-auto">
                
                <div className="select-none mb-5 sm:mb-6" style={{ filter: 'blur(4px)' }}>
                  <p className="text-[clamp(18px,4vw,26px)] leading-[1.3] font-normal text-white m-0">
                    Hey there, meet A.R.I.A,<br />
                    Mainframe's Adaptive Response Interface Agent
                  </p>
                </div>

                <p className="text-white mb-5 sm:mb-6 text-[clamp(18px,4vw,26px)] leading-[1.35] font-normal min-h-[54px] m-0">
                  {displayed}
                  {!done && (
                    <span className="inline-block w-[2px] h-[1.1em] bg-white align-middle ml-[2px] animate-blink" />
                  )}
                </p>

                <div className={`flex flex-wrap gap-y-1 transition-all duration-500 ${pillsVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'}`}>
                  {[
                    { label: 'Pitch us an idea', action: 'Pitch us an idea' },
                    { label: 'Come work here', action: 'Come work here' },
                    { label: 'Send a brief hello', action: 'Send a brief hello' },
                    { label: 'See how we operate', action: 'See how we operate' },
                  ].map((btn) => (
                    <button
                      key={btn.label}
                      onClick={() => handleActionClick(btn.action)}
                      className="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap cursor-pointer hover:bg-black hover:text-white transition-colors duration-200"
                    >
                      {btn.label}
                    </button>
                  ))}

                  <button
                    onClick={handleCopyEmail}
                    className="inline-flex items-center justify-center gap-2 sm:gap-3 text-white bg-transparent border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap cursor-pointer hover:bg-white hover:text-black transition-colors duration-200"
                    title="Click to copy email address"
                  >
                    <span>{copied ? 'Copied to clipboard!' : 'Reach us: hello@mainframe.co'}</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </button>
                </div>

              </div>
            </main>

            {/* INTERACTIVE MODAL */}
            {activeModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-[#111] border border-white/20 rounded-2xl p-6 sm:p-8 max-w-md w-full relative">
                  <button 
                    onClick={() => setActiveModal(null)}
                    className="absolute top-4 right-4 text-white/60 hover:text-white text-xl bg-transparent border-none cursor-pointer"
                  >
                    ✕
                  </button>
                  <span className="text-xs uppercase tracking-widest text-white/50 block mb-2">A.R.I.A Assistant</span>
                  <h3 className="text-2xl font-medium mb-3">{activeModal}</h3>
                  <p className="text-white/80 text-sm mb-6 leading-relaxed">
                    You've triggered the <strong className="text-white">{activeModal}</strong> protocol with Mainframe. We are currently accepting select briefs and partners for the upcoming quarter.
                  </p>
                  <div className="flex gap-3">
                    <button 
                      onClick={() => { window.location.href = 'mailto:hello@mainframe.co'; }}
                      className="flex-1 bg-white text-black font-medium py-3 rounded-full text-sm hover:bg-white/90 transition-colors cursor-pointer border-none"
                    >
                      Send Direct Email
                    </button>
                    <button 
                      onClick={() => setActiveModal(null)}
                      className="px-5 bg-transparent border border-white/30 text-white font-medium py-3 rounded-full text-sm hover:bg-white/10 transition-colors cursor-pointer"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
